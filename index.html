<!DOCTYPE html>
<html>
<head>
  <title>Satellite Interpolation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      max-width: 400px;
      overflow: auto;
    }

    #controls label {
      font-weight: bold;
    }

    #controls select,
    #controls input,
    #controls button {
      padding: 4px 6px;
      margin-bottom: 4px;
      font-size: 0.9em;
    }

    #controls button {
      cursor: pointer;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    #progressBarContainer {
      width: 100%;
      background-color: #ddd;
      height: 16px;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 6px;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background-color: #4caf50;
      transition: width 0.3s ease;
    }

    #logList {
      max-height: 150px;
      overflow-y: auto;
      font-size: 0.85em;
      background: #f9f9f9;
      border: 1px solid #aaa;
      padding: 6px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div id="controls">
  <!-- Preview Controls -->
  <div class="control-row">
    <label for="previewDateSelect">Preview:</label>
    <input type="date" id="previewDateSelect" />
    <select id="previewTimeSelect"></select>
    <button id="previewBtn">Preview</button>
    <button id="clearPreviewBtn">Clear</button>
  </div>

  <!-- Generation Controls -->
  <div class="control-row">
    <label for="startDateSelect">Start:</label>
    <input type="date" id="startDateSelect" />
    <select id="startTimeSelect"></select>
  </div>

  <div class="control-row">
    <label for="endDateSelect">End:</label>
    <input type="date" id="endDateSelect" />
    <select id="endTimeSelect"></select>
  </div>

  <div class="control-row">
    <button id="drawBtn">Draw BBOX</button>
    <button id="combinedBtn">Generate Video</button>
  </div>

  <div id="progressBarContainer"><div id="progressBar"></div></div>
  <div id="logList"></div>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.js"></script>
<script src="script.js"></script>

</body>
</html>
